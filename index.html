<style>
:root{
  --bg:#f5f1ea; --card:#fffdf9; --ink:#1d2433; --muted:#6b7280; --line:#e7e0d4;
  --pri:#0e7c6b; --pri-2:#0a5c50; --pri-soft:#e1f2ee;
  --acc:#f2a93b; --acc-soft:#fdf0db;
  --good:#16a34a; --good-soft:#e6f6ea; --bad:#dc2626; --bad-soft:#fde8e8;
  --r:18px; --shadow:0 1px 2px rgba(29,36,51,.05),0 6px 20px rgba(29,36,51,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Rubik,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
.en{direction:ltr;unicode-bidi:isolate}
#top{position:sticky;top:0;z-index:10;background:rgba(245,241,234,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;cursor:pointer}
.brand .logo{width:34px;height:34px;border-radius:10px;display:block}
.chips{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip.lvl{background:var(--pri);color:#fff;border-color:var(--pri)}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px}
.iconbtn:hover{background:var(--card)}
main{max-width:760px;margin:0 auto;padding:18px 16px 80px}
h1{font-size:28px;margin:6px 0 4px;letter-spacing:-.5px}
h2{font-size:22px;margin:4px 0 12px}
h3{font-size:17px;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.mod{text-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s;display:flex;flex-direction:column;gap:4px;min-height:118px}
.mod:hover{transform:translateY(-2px);border-color:var(--pri)}
.mod .ic{font-size:26px}
.mod .t{font-weight:700}
.mod .d{font-size:13px;color:var(--muted)}
.mod .ai{font-size:11px;font-weight:700;color:var(--pri);background:var(--pri-soft);border-radius:6px;padding:1px 6px;align-self:flex-start;margin-top:auto}
.hero{background:linear-gradient(135deg,var(--pri),#13967f);color:#fff;border:0}
.hero .muted{color:rgba(255,255,255,.8)}
.hero-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:74px;height:74px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 18px;font-weight:600;transition:background .12s,transform .08s}
.btn:active{transform:scale(.98)}
.primary{background:var(--pri);color:#fff}
.primary:hover{background:var(--pri-2)}
.light{background:#fff;color:var(--pri)}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.ghost:hover{background:var(--card)}
.accent{background:var(--acc);color:#3b2600}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.wide{width:100%}
.wotd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wotd .w{font-size:24px;font-weight:700}
.spk{width:42px;height:42px;border-radius:50%;background:var(--pri-soft);color:var(--pri);font-size:18px;display:inline-grid;place-items:center;flex:none}
.spk:hover{background:#cfe9e2}
.spk.sm{width:32px;height:32px;font-size:14px}
.ses-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .3s}
.ses-title{font-size:15px;color:var(--muted);font-weight:600;margin:0 0 10px}
.prompt{display:flex;align-items:center;gap:14px;justify-content:center;padding:22px 10px;flex-wrap:wrap}
.big{font-size:36px;font-weight:700;letter-spacing:-.5px}
.he-big{font-size:28px;font-weight:700}
.opts{display:grid;gap:10px;margin-top:10px}
@media(min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px 16px;text-align:start;font-weight:500;font-size:17px;transition:border-color .1s,background .1s}
.opt:hover:not([disabled]){border-color:var(--pri)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.sentence{font-size:22px;font-weight:500;text-align:center;padding:18px 6px;line-height:1.7}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--acc);color:var(--pri);font-weight:700;padding:0 6px}
.inp{width:100%;border:2px solid var(--line);border-radius:14px;padding:13px 15px;font-size:18px;background:#fff;outline:none}
.inp:focus{border-color:var(--pri)}
textarea.inp{min-height:150px;resize:vertical;line-height:1.6}
.fb{margin-top:14px;border-radius:var(--r);padding:16px;animation:pop .2s ease-out}
.fb.good{background:var(--good-soft);border:1px solid #bfe5c9}
.fb.bad{background:var(--bad-soft);border:1px solid #f5c2c2}
.fb-h{font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.fb .xp{font-size:13px;background:#fff;border-radius:99px;padding:2px 10px;color:var(--pri)}
.fb>*+*{margin-top:8px}
.explain{background:rgba(255,255,255,.7);border-radius:12px;padding:10px 12px;font-size:15px}
.ex{display:flex;gap:8px;align-items:center;justify-content:flex-end;font-size:16px}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.mic{background:var(--acc);color:#3b2600;border-radius:999px;padding:12px 20px;font-weight:700;display:inline-flex;gap:8px;align-items:center}
.mic.rec{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}100%{box-shadow:0 0 0 14px rgba(220,38,38,0)}}
.heard{min-height:28px;font-size:18px;text-align:center;color:var(--pri-2);font-weight:500;margin-top:8px}
.needs-mic,.needs-ai{display:none!important}
body.has-mic .needs-mic{display:inline-flex!important}
body.has-ai .needs-ai{display:inline-flex!important}
body.has-mic .no-mic,body.has-ai .no-ai{display:none!important}
.note{background:var(--acc-soft);border:1px solid #f4d7a6;border-radius:14px;padding:12px 14px;font-size:14px}
.w-ok{color:var(--good);font-weight:600}
.w-miss{color:var(--bad);font-weight:700;text-decoration:underline wavy}
.diff{font-size:18px;line-height:1.9;background:#fff;border-radius:12px;padding:8px 12px}
.pill{display:inline-block;background:var(--pri-soft);color:var(--pri-2);border-radius:99px;padding:3px 12px;font-size:14px;font-weight:600}
.lvlpick{display:flex;gap:8px;flex-wrap:wrap}
.lvlpick button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;text-align:center;min-width:92px}
.lvlpick button b{display:block;font-size:20px}
.lvlpick button.on,.lvlpick button:hover{border-color:var(--pri);background:var(--pri-soft)}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:280px}
.msg{max-width:86%;padding:11px 14px;border-radius:18px;font-size:16px;animation:pop .2s}
.msg.ai{align-self:flex-end;background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.me{align-self:flex-start;background:var(--pri);color:#fff;border-bottom-right-radius:6px}
.msg .tools{display:flex;gap:6px;margin-top:6px;justify-content:flex-end}
.msg .tr{font-size:14px;color:var(--muted);margin-top:6px;direction:rtl}
.corr{align-self:flex-start;max-width:86%;background:var(--acc-soft);border:1px solid #f4d7a6;border-radius:14px;padding:8px 12px;font-size:14px}
.chatbar{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:flex;gap:8px;align-items:center}
.chatbar .inp{font-size:16px;padding:11px 14px}
.typing{align-self:flex-end;color:var(--muted);font-size:14px}
.scen{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
/* stories */
.story{font-size:19px;line-height:1.9}
.tw{cursor:pointer;border-radius:4px;padding:0 1px}
.tw:hover{background:var(--acc-soft)}
.tw.known{border-bottom:2px dotted var(--pri)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(20,24,33,.45);display:grid;place-items:center;z-index:50;padding:16px}
#modal[hidden]{display:none}
#modal .card{max-width:420px;width:100%;animation:pop .15s}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.stat{display:flex;flex-direction:column;align-items:center;padding:14px;text-align:center}
.stat b{font-size:28px}
.sbar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;flex:1}
.sbar i{display:block;height:100%;background:var(--pri)}
.week{display:flex;gap:8px;align-items:flex-end;height:120px;padding-top:10px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:12px;color:var(--muted)}
.week i{width:100%;background:var(--pri);border-radius:6px 6px 2px 2px;min-height:3px}
.mist{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.mist:last-child{border:0}
.tag{font-size:12px;background:var(--line);border-radius:6px;padding:1px 7px;color:var(--muted);white-space:nowrap}
.tip-ex{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:6px}
.loader{display:inline-block;width:18px;height:18px;border:3px solid var(--pri-soft);border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.fbtn{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
label.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
select.inp{width:auto;font-size:15px;padding:8px 12px}
@media(max-width:480px){.big{font-size:30px}.chip.hide-sm{display:none}h1{font-size:24px}}
</style>

/* --- שמירה כפולה במכשיר: localStorage + IndexedDB --- */
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('tuki',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
async function idbSet(k,v){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(v,k);}catch(e){}}
async function idbGet(k){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null);});}catch(e){return null;}}
let idbTimer=null;
function save(){S.updatedAt=now();const j=JSON.stringify(S);try{localStorage.setItem(KEY,j);}catch(e){}clearTimeout(idbTimer);idbTimer=setTimeout(()=>idbSet(KEY,j),300);}
function saveNow(){const j=JSON.stringify(S);try{localStorage.setItem(KEY,j);}catch(e){}idbSet(KEY,j);}
addEventListener('pagehide',saveNow);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow();});

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));}catch(e){voices=[];}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}
function pickVoice(){
 if(!voices.length)loadVoices();
 const byName=S.settings.voiceName&&voices.find(v=>v.name===S.settings.voiceName);if(byName)return byName;
 const pref=[/Samantha/i,/Google US English/i,/Microsoft (Aria|Jenny|Guy).*Online/i,/Alex/i,/Daniel/i];
 for(const p of pref){const v=voices.find(v=>p.test(v.name));if(v)return v;}
 return voices.find(v=>/en[-_]US/i.test(v.lang))||voices[0]||null;}
function browserSpeak(text,slow,onend){
 if(!text){onend&&onend();return;}
 let done=false;const fin=()=>{if(done)return;done=true;onend&&onend();};
 try{if(!('speechSynthesis' in window)){if(!onend)toast('הקראה לא זמינה בדפדפן הזה');fin();return;}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=slow?0.7:S.settings.rate;
  const v=pickVoice();if(v){u.voice=v;u.lang=v.lang;}
  if(onend){u.onend=fin;u.onerror=fin;setTimeout(fin,Math.max(2500,text.length*95/(u.rate||1))+1500);}
  speechSynthesis.speak(u);}catch(e){fin();}}

 try{return JSON.parse(t);}catch(e){}
 const a=Math.min(...['{','['].map(c=>{const i=t.indexOf(c);return i<0?1e9:i;})),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));

async function ai(prompt){

 try{
  if(PROXY_URL){
   r=await fetch(PROXY_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt})});
   if(!r.ok)throw{code:r.status===429?'rate_limited':'http'};
   return parseJSON((await r.json()).text);}
  if(!S.settings.aiKey)throw{code:'unavailable'};
  const model=(S.settings.aiModel||'gemini-flash-latest').trim();
  r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',
   headers:{'content-type':'application/json','x-goog-api-key':S.settings.aiKey.trim()},
   body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:0.7}})});
  if(!r.ok)throw{code:r.status===429?'rate_limited':(r.status===400||r.status===401||r.status===403)?'bad_key':r.status===404?'bad_model':'http'};
  const j=await r.json();
  return parseJSON((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts||[]).map(p=>p.text||'').join(''));
 }catch(e){if(e&&e.code)throw e;throw{code:'network'};}
}

/* ====================== PLACEMENT ====================== */
function startPlacement(){
 const qs=[];LEVELS.forEach(l=>{qs.push({lvl:l,q:makeVocabQ(pick(WORDS.filter(w=>w.lvl===l)),'mcq',true)});shuffle(CLOZE.filter(c=>c.lvl===l)).slice(0,2).forEach(c=>qs.push({lvl:l,q:makeClozeQ(c)}));});
 const score={};LEVELS.forEach(l=>score[l]=0);let i=0;
 const finish=()=>{let lv='A1';for(const l of LEVELS){if(score[l]>=2)lv=l;else break;}
  view(`<div class="card stack" style="text-align:center"><div style="font-size:54px">🎓</div><h1>הרמה שלך: ${lv}</h1><p class="pill" style="font-size:16px">${LVL_HE[lv]}</p>
  <p>נתחיל מכאן. ככל שתתרגל, האפליקציה תעלה או תוריד את הרמה אוטומטית.</p><button class="btn primary" id="go">בוא נתחיל ←</button></div>`);
  $('#go').onclick=()=>setLevel(lv);};
 const step=()=>{
  if(i>0&&i%3===0&&score[qs[i-1].lvl]<=1)return finish();
  if(i>=qs.length)return finish();
  const cur=qs[i];
  view(`<div class="ses-head"><button class="iconbtn" onclick="welcome()">✕</button><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><span class="muted small">${i+1}/${qs.length}</span></div><h2 class="ses-title">🎯 מבחן רמה</h2><div id="q" class="card"></div>`);
  let done=false;cur.q.render($('#q'),ok=>{if(done)return;done=true;if(ok)score[cur.lvl]++;i++;setTimeout(step,700);});
 };step();}

/* ====================== SESSION RUNNER ====================== */
const PRAISE=['מעולה! ✓','כל הכבוד! ✓','בדיוק! ✓','יפה מאוד! ✓','מצוין! ✓'];
function runSession({title,items,kind,skill,onDone}){
 const ses={i:0,ok:0,n:items.length,xp:0,answered:0,wrong:[]};
 if(!ses.n){view(`<div class="card stack"><h2>${title}</h2><p>אין כרגע פריטים לתרגול כאן.</p><button class="btn primary" onclick="home()">חזרה</button></div>`);return;}
 const summary=()=>{const pct=ses.answered?Math.round(ses.ok/ses.answered*100):100;if(onDone){try{onDone(ses);}catch(e){}}
  view(`<div class="card stack" style="text-align:center"><div style="font-size:54px">${pct>=80?'🏆':pct>=50?'👏':'💪'}</div><h1>סיימת!</h1>
  <p style="font-size:18px">${ses.ok} מתוך ${ses.answered} נכונות · <b>+${ses.xp} XP</b></p>
  ${ses.wrong.length&&String(kind).startsWith('exam')?`<div class="explain" style="text-align:start"><b>כדאי לחזור על:</b>${ses.wrong.map(([a,b])=>`<div class="small">${/[\u0590-\u05FF]/.test(a)?esc(a)+' – <b class="en">'+esc(b)+'</b>':'<b class="en">'+esc(a)+'</b> – '+esc(b)}</div>`).join('')}</div>`:''}
  <div class="row" style="justify-content:center"><button class="btn primary" id="again">${kind==='path'?(S.path&&S.path.n>PATH_LEN?'🏆 סיום':'לשיעור הבא ←'):'עוד סבב'}</button><button class="btn ghost" onclick="home()">לבית</button></div>
  ${(kind==='cloze'||kind==='trans')?`<div class="needs-ai" style="justify-content:center"><button class="btn accent" id="moreai">✨ צור לי תרגילים חדשים עם AI</button></div>`:''}
  </div>`);
  $('#again').onclick=()=>open_(kind);const m=$('#moreai');if(m)m.onclick=()=>aiMore(kind,m);};
 const next=()=>{
  while(ses.i<ses.n){const q=items[ses.i++]();if(q)return show(q);}
  summary();};
 const show=q=>{
  view(`<div class="ses-head"><button class="iconbtn" title="יציאה" onclick="home()">✕</button><div class="bar"><i style="width:${(ses.i-1)/ses.n*100}%"></i></div><span class="muted small">${ses.i}/${ses.n}</span></div>
  <h2 class="ses-title">${title}</h2><div id="q" class="card"></div><div id="fb"></div>`,'session');
  let answered=false;
  q.render($('#q'),(ok,info={})=>{
   if(answered)return;answered=true;
   if(info.intro){addXP(3);ses.xp+=3;return next();}
   ses.answered++;if(ok)ses.ok++;else if(info.correct&&info.prompt&&ses.wrong.length<12)ses.wrong.push([info.prompt,info.correct]);
   const sk=q.skill||skill;const xp=record(sk,ok,q.lvl,info);ses.xp+=xp;
   feedback(ok,info,xp,sk,next,()=>{ses.ok++;});
  });};
 next();}
function feedback(ok,info,xp,skill,next,onOverride){
 const fb=$('#fb');const isHe=/[֐-׿]/.test(info.correct||'');
 fb.innerHTML=`<div class="fb ${ok?'good':'bad'}"><div class="fb-h"><span>${ok?(info.almost?'כמעט מושלם ✓':pick(PRAISE)):'לא הפעם ✗'}</span><span class="xp">+${xp} XP</span></div>
 ${(!ok||info.almost)&&info.correct?`<div>${info.almost?'הנוסח המדויק':'התשובה הנכונה'}: <b class="${isHe?'':'en'}">${esc(info.correct)}</b> ${!isHe?spk(info.correct,'sm'):''}</div>`:''}
 ${info.explain?`<div class="explain">💡 ${esc(info.explain)}</div>`:''}${info.extra||''}
 ${!ok&&info.aiCheck?`<div class="needs-ai"><button class="btn ghost" id="aichk">🤖 חושב שהתשובה שלך נכונה? בדוק עם AI</button></div><div id="aires"></div>`:''}
 <div class="fbtn"><button class="btn primary" id="nextb">המשך ←</button></div></div>`;
 const nb=$('#nextb');nb.onclick=next;setTimeout(()=>nb.focus(),30);
 const ac=$('#aichk');if(ac)ac.onclick=async()=>{ac.disabled=true;ac.innerHTML='<span class="loader"></span> בודק...';
  try{const r=await info.aiCheck();$('#aires').innerHTML=`<div class="explain">${r.correct?'✅ ':'❌ '}${esc(r.feedback_he||'')}</div>`;
   if(r.correct){S.stats[skill][0]++;removeMistake(info.kind,info.ref);addXP(8);onOverride();toast('התשובה נספרה כנכונה ✓');}
   ac.remove();}catch(e){aiErr(e);ac.disabled=false;ac.textContent='🤖 נסה שוב';}};
}
function lockOpts(el,rightIdx,chosenIdx){$$('.opt',el).forEach((b,i)=>{b.disabled=true;if(i===rightIdx)b.classList.add('right');else if(i===chosenIdx)b.classList.add('wrong');});}

/* ====================== QUESTION MAKERS ====================== */
function distractors(w,k,field){const same=allWords().filter(x=>x.en!==w.en&&x[field]!==w[field]&&x.lvl===w.lvl);const rest=allWords().filter(x=>x.en!==w.en&&x[field]!==w[field]);
 const out=shuffle(same).slice(0,k);for(const x of shuffle(rest)){if(out.length>=k)break;if(!out.includes(x))out.push(x);}return out;}
function makeVocabQ(w,type,noSrs){
 const r=S.words[w.en];
 if(!type){const box=r?r.box:0;const opts=box<=2?['mcq','mcq','listen','spell']:['mcq','listen','spell','spell'];if(dictCap)opts.push('say');type=pick(opts);}
 const base={lvl:w.lvl,skill:type==='listen'?'listening':type==='say'?'speaking':'vocab'};
 const done=(ans,ok,given)=>{if(!noSrs)srs(w.en,ok);ans(ok,{kind:'vocab',ref:w.en,prompt:w.en,correct:type==='mcq'?w.he:w.en,given,
   extra:`<div class="explain"><b class="en">${esc(w.en)}</b> = ${esc(w.he)}${w.ex?`<div class="ex en">${esc(w.ex)} ${spk(w.ex,'sm')}</div>`:''}</div>`});};
 if(type==='intro')return{...base,render(el,ans){
  el.innerHTML=`<div class="pill">✨ מילה חדשה · ${TAGS[w.tag]||''}</div><div class="prompt"><span class="big en">${esc(w.en)}</span>${spk(w.en)}${spkSlow(w.en)}</div>
  <div class="he-big" style="text-align:center">${esc(w.he)}</div>${w.ex?`<div class="ex en" style="justify-content:center;margin:12px 0">${esc(w.ex)} ${spk(w.ex,'sm')}</div>`:'<div style="height:12px"></div>'}
  <div style="text-align:center" id="say"><button class="mic needs-mic">🎤 נסה להגיד את המילה</button><div class="heard"></div></div>
  <div class="fbtn" style="justify-content:center"><button class="btn primary" id="gotit">הבנתי, המשך ←</button></div>`;
  if(S.settings.autoSpeak)setTimeout(()=>speak(w.en),250);
  micUI($('#say',el),t=>{const ok=saidWord(t,w.en);$('.heard',el).innerHTML=ok?`✅ מצוין! שמעתי: <span class="en">${esc(t)}</span>`:`🤔 שמעתי: <span class="en">${esc(t)}</span> – נסה שוב`;});
  $('#gotit',el).onclick=()=>{if(!noSrs){S.words[w.en]={box:1,due:now()+INT[1],ok:0,bad:0};}ans(true,{intro:true});};}};
 if(type==='mcq')return{...base,render(el,ans){
  const opts=shuffle([w,...distractors(w,3,'he')]);
  el.innerHTML=`<div class="prompt"><span class="big en">${esc(w.en)}</span>${spk(w.en)}</div><p class="muted" style="text-align:center">מה הפירוש?</p><div class="opts two">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.he)}</button>`).join('')}</div>`;
  if(S.settings.autoSpeak&&!noSrs)setTimeout(()=>speak(w.en),250);
  $$('.opt',el).forEach(b=>b.onclick=()=>{const c=+b.dataset.i,ok=opts[c]===w;lockOpts(el,opts.indexOf(w),c);done(ans,ok,opts[c].he);});}};
 if(type==='listen')return{...base,render(el,ans){
  const opts=shuffle([w,...distractors(w,3,'en')]);
  el.innerHTML=`<p class="muted" style="text-align:center">הקשב ובחר את המילה ששמעת</p><div class="prompt">${spk(w.en).replace('class="spk "','class="spk" style="width:72px;height:72px;font-size:30px"')}${spkSlow(w.en)}</div><div class="opts two">${opts.map((o,i)=>`<button class="opt en" data-i="${i}">${esc(o.en)}</button>`).join('')}</div>`;
  setTimeout(()=>speak(w.en),250);
  $$('.opt',el).forEach(b=>b.onclick=()=>{const c=+b.dataset.i,ok=opts[c]===w;lockOpts(el,opts.indexOf(w),c);done(ans,ok,opts[c].en);});}};
 if(type==='spell')return{...base,render(el,ans){
  el.innerHTML=`<p class="muted" style="text-align:center">כתוב באנגלית</p><div class="prompt"><span class="he-big">${esc(w.he)}</span></div>
  <input class="inp en" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type here..."><div class="fbtn"><button class="btn primary" id="chk">בדוק</button><button class="btn ghost" id="hint">💡 רמז</button><button class="btn ghost" id="idk">לא יודע</button></div>`;
  const inp=$('#in',el);setTimeout(()=>inp.focus(),50);
  const check=()=>{const g=inp.value.trim();if(!g)return;const s=sim(normEn(g),normEn(w.en));const ok=s>=0.85;inp.disabled=true;
   srs(w.en,ok&&s===1?true:ok);ans(ok,{kind:'vocab',ref:w.en,prompt:w.he,correct:w.en,given:g,almost:ok&&s<1,extra:`${w.ex?`<div class="ex en">${esc(w.ex)} ${spk(w.ex,'sm')}</div>`:''}`});};
  $('#chk',el).onclick=check;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check();}};
  $('#hint',el).onclick=()=>{inp.placeholder=w.en[0]+'_'.repeat(w.en.length-1)+`  (${w.en.length})`;speak(w.en);};
  $('#idk',el).onclick=()=>{inp.disabled=true;srs(w.en,false);ans(false,{kind:'vocab',ref:w.en,prompt:w.he,correct:w.en,given:'',extra:`${w.ex?`<div class="ex en">${esc(w.ex)} ${spk(w.ex,'sm')}</div>`:''}`});};}};
 if(type==='say')return{...base,render(el,ans){
  el.innerHTML=`<p class="muted" style="text-align:center">הקשב, ואז אמור את המילה בקול</p><div class="prompt"><span class="big en">${esc(w.en)}</span>${spk(w.en)}${spkSlow(w.en)}</div><div style="text-align:center">${esc(w.he)}</div>
  <div style="text-align:center;margin-top:14px" id="say"><button class="mic">🎤 לחץ ודבר</button><div class="heard"></div><button class="btn ghost small" id="skip" style="margin-top:8px">לא יכול לדבר עכשיו</button></div>`;
  let tries=0;
  micUI($('#say',el),t=>{tries++;const ok=saidWord(t,w.en);if(ok||tries>=2){srs(w.en,ok);ans(ok,{kind:'vocab',ref:w.en,prompt:w.en,correct:w.en,given:t,explain:ok?'':'טיפ: הקשב שוב באיטיות (🐢) ונסה לחקות את ההברה המודגשת.'});}
   else $('.heard',el).innerHTML=`שמעתי: <span class="en">${esc(t)}</span> – נסה עוד פעם 🎯`;});
  $('#skip',el).onclick=()=>makeVocabQ(w,'mcq').render(el,ans);}};
}
function makeClozeQ(c){return{lvl:c.lvl,skill:'grammar',render(el,ans){
 const opts=shuffle(c.o.slice()),parts=c.s.split('___'),full=c.s.replace('___',c.a);
 el.innerHTML=`<p class="muted" style="text-align:center">בחר את המילה החסרה</p><div class="sentence en">${esc(parts[0])}<span class="blank">&nbsp;?&nbsp;</span>${esc(parts[1]||'')}</div><div class="opts two">${opts.map((o,i)=>`<button class="opt en" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
 $$('.opt',el).forEach(b=>b.onclick=()=>{const k=+b.dataset.i,ok=opts[k]===c.a;lockOpts(el,opts.indexOf(c.a),k);$('.blank',el).textContent=c.a;
  ans(ok,{kind:'cloze',ref:c.s,prompt:c.s,correct:c.a,given:opts[k],explain:c.h,extra:`<div class="ex en">${esc(full)} ${spk(full,'sm')}</div>`});});}};}
function makeTransQ(t,dir){
 dir=dir||(Math.random()<0.6?'he2en':'en2he');
 const src=dir==='he2en'?t.he[0]:t.en[0],acc=dir==='he2en'?t.en:t.he,norm=dir==='he2en'?normEn:normHe;
 return{lvl:t.lvl,skill:'translate',render(el,ans){
  el.innerHTML=`<p class="muted" style="text-align:center">${dir==='he2en'?'תרגם לאנגלית':'תרגם לעברית'}</p>
  <div class="prompt">${dir==='he2en'?`<span class="he-big">${esc(src)}</span>`:`<span class="he-big en">${esc(src)}</span>${spk(src)}`}</div>
  <input class="inp ${dir==='he2en'?'en':''}" id="in" autocomplete="off" spellcheck="false" placeholder="${dir==='he2en'?'Type in English...':'כתוב בעברית...'}">
  <div class="fbtn"><button class="btn primary" id="chk">בדוק</button><button class="btn ghost" id="idk">לא יודע</button></div>`;
  const inp=$('#in',el);setTimeout(()=>inp.focus(),50);
  const info=(g,ok,almost,idx)=>({kind:'trans',ref:t.he[0]+'|'+dir,dir,prompt:src,correct:acc[idx],given:g,almost,
   explain:acc.length>1?'גם נכון: '+acc.filter((_,i)=>i!==idx).join(' / '):'',
   aiCheck:g?()=>judgeTrans(src,g,acc,dir):null});
  const check=async()=>{const g=inp.value.trim();if(!g||inp.disabled)return;const {best,idx}=bestMatch(g,acc,norm);inp.disabled=true;
   if(best>=0.85)return ans(true,info(g,true,best<0.97,idx));
   if(aiReady()){const cb=$('#chk',el);cb.disabled=true;cb.innerHTML='<span class="loader"></span> בודק משמעות...';
    try{const r=await judgeTrans(src,g,acc,dir);const i=info(g,!!r.correct,!!r.correct,idx);i.explain=(r.correct?'✅ ':'')+(r.feedback_he||'')+(i.explain?' · '+i.explain:'');if(r.correct)i.aiCheck=null;return ans(!!r.correct,i);}catch(e){}}
   ans(false,info(g,false,false,idx));};
  $('#chk',el).onclick=check;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check();}};
  $('#idk',el).onclick=()=>{inp.disabled=true;ans(false,info('',false,false,0));};}};}
function judgeTrans(src,g,acc,dir){return ai(`You are a kind, lenient English teacher checking a translation by a native Hebrew speaker (CEFR ${S.level}).
Source (${dir==='he2en'?'Hebrew':'English'}): "${src}"
Learner's ${dir==='he2en'?'English':'Hebrew'} translation: "${g}"
Example correct translations: ${JSON.stringify(acc)}
Judge by MEANING. Mark it correct if the meaning is right, even when the wording differs from the examples.
Be lenient about: masculine/feminine forms, synonyms, word order, small spelling mistakes, and everyday Hebrew phrasing that conveys the same idea (for example "אם ידעתי הייתי מגיע" is an acceptable translation of "If I had known, I would have come").
${dir==='he2en'?'For English answers, accept small grammar slips if the meaning is clear, but mention the correct form.':''}
Mark it wrong only if the meaning is different or important information is missing.
Return only JSON: {"correct": boolean, "feedback_he": "one short, encouraging sentence in Hebrew (if correct, you may mention a more precise wording; if wrong, explain what is missing)"}`);}
function dictPool(lvl){const s=WORDS.filter(w=>w.lvl===lvl).map(w=>w.ex).concat(CLOZE.filter(c=>c.lvl===lvl).map(c=>c.s.replace('___',c.a)));return s;}
function makeDictQ(sent,lvl){return{lvl,skill:'listening',render(el,ans){
 el.innerHTML=`<p class="muted" style="text-align:center">הקשב וכתוב את המשפט באנגלית</p><div class="prompt"><button class="spk" style="width:72px;height:72px;font-size:30px" data-say="${esc(sent)}">🔊</button>${spkSlow(sent)}</div>
 <input class="inp en" id="in" autocomplete="off" spellcheck="false" placeholder="Type what you hear..."><div class="fbtn"><button class="btn primary" id="chk">בדוק</button></div>`;
 setTimeout(()=>speak(sent),300);const inp=$('#in',el);setTimeout(()=>inp.focus(),60);
 const check=()=>{const g=inp.value.trim();if(!g)return;inp.disabled=true;const d=wordDiff(sent,g);const ok=d.ratio>=0.9;
  ans(ok,{kind:'dict',ref:sent,prompt:'הכתבה',correct:sent,given:g,almost:ok&&d.ratio<1,extra:`<div class="diff en">${d.html}</div><div class="small muted">מילים באדום – פספסת או כתבת אחרת.</div>`});};
 $('#chk',el).onclick=check;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check();}};}};}
function makePairQ(p,mode){
 mode=mode||(dictCap&&Math.random()<0.35?'say':'hear');const target=Math.random()<0.5?p.a:p.b,other=target===p.a?p.b:p.a;
 const extra=`<div class="explain"><div class="row en" style="justify-content:flex-end"><b>${p.a}</b>${spk(p.a,'sm')}&nbsp;&nbsp;<b>${p.b}</b>${spk(p.b,'sm')}</div><div style="margin-top:6px">👄 ${esc(p.tip)}</div></div>`;
 if(mode==='hear')return{skill:'listening',render(el,ans){
  const opts=shuffle([p.a,p.b]);
  el.innerHTML=`<p class="muted" style="text-align:center">איזו מילה שמעת?</p><div class="prompt"><button class="spk" style="width:72px;height:72px;font-size:30px" data-say="${target}">🔊</button>${spkSlow(target)}</div><div class="opts two">${opts.map((o,i)=>`<button class="opt en" style="text-align:center;font-size:22px" data-i="${i}">${o}</button>`).join('')}</div>`;
  setTimeout(()=>speak(target),300);
  $$('.opt',el).forEach(b=>b.onclick=()=>{const k=+b.dataset.i,ok=opts[k]===target;lockOpts(el,opts.indexOf(target),k);ans(ok,{correct:target,given:opts[k],extra});});}};
 return{skill:'speaking',render(el,ans){
  el.innerHTML=`<p class="muted" style="text-align:center">אמור את המילה – ולא את "${other}"!</p><div class="prompt"><span class="big en">${target}</span>${spk(target)}${spkSlow(target)}</div>
  <div style="text-align:center" id="say"><button class="mic">🎤 לחץ ודבר</button><div class="heard"></div></div>`;
  let tries=0;micUI($('#say',el),t=>{tries++;const n=normEn(t);const ok=saidWord(t,target)&&!(' '+n+' ').includes(' '+other+' ');
   if(ok||tries>=2)ans(ok,{correct:target,given:t,extra});else $('.heard',el).innerHTML=`שמעתי: <span class="en">${esc(t)}</span> – נסה שוב`;});}};}
/* ====================== MODULE STARTERS ====================== */
function vocabItems(n=10,only){
 const t=now(),li=lvlIdx(S.level);
 const pool=allWords().filter(w=>lvlIdx(w.lvl)<=li||w.custom);
 const due=pool.filter(w=>S.words[w.en]&&S.words[w.en].due<=t).sort((a,b)=>S.words[a.en].due-S.words[b.en].due);
 let fresh=only?only.filter(w=>!S.words[w.en]||S.words[w.en].box===0):shuffle(pool.filter(w=>!S.words[w.en])).sort((a,b)=>(b.lvl===S.level)-(a.lvl===S.level));
 fresh=fresh.slice(0,only?10:4);
 const quiz=[...fresh.map(w=>({w})),...due.slice(0,n).map(w=>({w}))];
 if(only)only.filter(w=>!fresh.includes(w)).forEach(w=>quiz.push({w}));
 const seen=shuffle(pool.filter(w=>S.words[w.en]&&!due.includes(w)));while(quiz.length<n-fresh.length&&seen.length)quiz.push({w:seen.pop()});
 const intro=fresh.map(w=>({w,type:'intro'}));const qz=quiz.slice(0,Math.max(n-intro.length,fresh.length));
 // keep new-word quizzes after their intros
 const out=[];const freshQ=qz.filter(x=>fresh.includes(x.w)),otherQ=shuffle(qz.filter(x=>!fresh.includes(x.w)));
 intro.forEach((x,i)=>{out.push(x);if(otherQ.length)out.push(otherQ.shift());if(i>0&&freshQ.length)out.push(freshQ.shift());});
 out.push(...shuffle(freshQ.concat(otherQ)));
 return out.map(x=>()=>makeVocabQ(x.w,x.type));}
function startVocab(only){runSession({title:'📚 אוצר מילים',kind:'vocab',skill:'vocab',items:vocabItems(10,only)});}

const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
const PAST={go:'went',eat:'ate',see:'saw',buy:'bought',do:'did',have:'had',come:'came',meet:'met',take:'took',make:'made',write:'wrote',drink:'drank',get:'got',is:'was',are:'were',visit:'visited',play:'played',watch:'watched',work:'worked',study:'studied',travel:'traveled',like:'liked',want:'wanted',live:'lived',swim:'swam',fly:'flew',sleep:'slept',buys:'bought',goes:'went',eats:'ate',sees:'saw',has:'had'};
const BASE={went:'go',saw:'see',ate:'eat',bought:'buy',did:'do',had:'have',came:'come',took:'take',made:'make',got:'get',wrote:'write',drank:'drink',met:'meet',flew:'fly',slept:'sleep',swam:'swim',told:'tell',said:'say',gave:'give',found:'find',left:'leave',thought:'think'};
const S3=v=>({go:'goes',do:'does',have:'has',study:'studies',watch:'watches',fly:'flies'}[v]||v+'s');
const NUMW='(?:\\d+|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|fifteen|twenty|thirty|forty|fifty|sixty|seventy)';
const cap=(src,out)=>/^[A-Z]/.test(src)?out.charAt(0).toUpperCase()+out.slice(1):out;
const LRULES=[
 {re:/\bi\b/g,fix:()=>'I',he:'המילה I (אני) נכתבת תמיד באות גדולה.'},
 {re:/(?<!\b(?:does|did|will|can|would|should|could|must|to|might|may|do|let|make|help|not)\s)\b(he|she|it)\s+(go|do|have|like|want|work|live|need|know|think|play|eat|drink|study|watch|love|speak|come|feel|fly)\b/gi,fix:(m,p,v)=>`${p} ${S3(v.toLowerCase())}`,he:'בהווה פשוט עם he / she / it מוסיפים s לפועל (he works, she goes).'},
 {re:/\b(I|you|we|they) (wants|likes|goes|needs|loves|works|lives|knows|thinks|plays|has|does|eats|drinks|speaks|studies|watches)\b/gi,fix:(m,p,v)=>{v=v.toLowerCase();const b={has:'have',does:'do',goes:'go',studies:'study',watches:'watch'}[v]||v.replace(/s$/,'');return `${p} ${b}`;},he:'עם I / you / we / they לא מוסיפים s לפועל (I want, they like).'},
 {re:/\b(didn't|did not|don't|doesn't)\s+(went|saw|ate|bought|did|had|came|took|made|got|wrote|drank|met|flew|slept|swam|told|said|gave|found|left|thought)\b/gi,fix:(m,a,v)=>`${a} ${BASE[v.toLowerCase()]}`,he:'אחרי did / didn\'t / don\'t הפועל חוזר לצורת הבסיס (didn\'t go).'},
 {re:/\bopen (the |my )?(light|lights|tv|television|air conditioner|ac|computer|radio)\b/gi,fix:(m,t,x)=>cap(m,`turn on ${t||'the '}${x}`),he:'באנגלית לא "פותחים" אור או טלוויזיה – אומרים turn on.'},
 {re:/\bclose (the |my )?(light|lights|tv|television|air conditioner|ac|computer|radio)\b/gi,fix:(m,t,x)=>cap(m,`turn off ${t||'the '}${x}`),he:'באנגלית לא "סוגרים" אור או טלוויזיה – אומרים turn off.'},
 {re:new RegExp(`\\b(I|he|she|you|we|they) (have|has) (${NUMW}) years\\b(?! of)`,'gi'),fix:(m,p,h,n)=>`${p} ${/^i$/i.test(p)?'am':/^(he|she)$/i.test(p)?'is':'are'} ${n} years old`,he:'גיל אומרים עם be ולא עם have: I am 30 years old.'},
 {re:/\bgood in\b/gi,fix:m=>cap(m,'good at'),he:'"טוב ב..." באנגלית זה good at.'},
 {re:new RegExp(`\\bsince (${NUMW}) (years|months|weeks|days|hours)\\b`,'gi'),fix:(m,n,u)=>`for ${n} ${u}`,he:'משך זמן = for. since בא לפני נקודת התחלה (since 2020).'},

 {re:/\ba (?!one\b|once\b)((?:[aeio]|hour|honest|umbrella|uncle|ugly|unhappy|unusual|under)\w*)/g,fix:(m,w)=>`an ${w}`,he:'לפני צליל תנועה (a, e, i, o) משתמשים ב-an.'},
 {re:/\b(I|we|they|you) (am|are) agree\b/gi,fix:(m,p)=>`${p} agree`,he:'agree הוא פועל – אומרים I agree, בלי am.'},
 {re:/\bdepend(s)? (in|from)\b/gi,fix:(m,s)=>`depend${s||''} on`,he:'אומרים depend on.'},
 {re:/\bwait to (me|him|her|you|us|them|the bus|the train)\b/gi,fix:(m,o)=>`wait for ${o}`,he:'"לחכות ל..." זה wait for.'},

 {re:/\b(in|at) the (?:last|next) (week|month|year|weekend)\b/gi,fix:(m,p,u)=>m.replace(/^(in|at) the /i,''),he:'לפני last / next לא שמים in the: last week, next year.'},
 {re:/\bhow (?:it|do you) call(?:s)? (?:it|this|that)?\b/gi,fix:()=>'what is it called',he:'"איך קוראים לזה" = What is it called?'},
];
function localCheck(text){
 const out=[];
 for(const r of LRULES){r.re.lastIndex=0;for(const m of text.matchAll(r.re)){let fixed=r.fix(...m);if(fixed&&/^[A-Z]/.test(m[0])&&/^[a-z]/.test(fixed))fixed=fixed[0].toUpperCase()+fixed.slice(1);if(fixed&&fixed!==m[0])out.push({offset:m.index,length:m[0].length,original:m[0],fixed,explain_he:r.he});}}
 // past time markers with present verbs
 const re=/[^.!?]+[.!?]?/g;let s;
 while((s=re.exec(text))){const sent=s[0];if(!/\b(yesterday|last (?:week|night|year|month|summer|weekend|time)|ago)\b/i.test(sent))continue;
  for(const m of sent.matchAll(/\b(I|we|they|you|he|she|it)\s+(go|goes|eat|eats|see|sees|buy|buys|do|have|has|come|meet|take|make|write|drink|get|is|are|visit|play|watch|work|study|travel|swim|fly|sleep)\b/gi)){
   const v=m[2].toLowerCase();if(!PAST[v])continue;
   out.push({offset:s.index+m.index,length:m[0].length,original:m[0],fixed:`${m[1]==='i'?'I':m[1]} ${PAST[v]}`,explain_he:'מדובר בעבר (yesterday / last / ago) – צריך פועל בזמן עבר.'});}}
 return out;}
const LT_CAT={TYPOS:'שגיאת כתיב',GRAMMAR:'דקדוק',PUNCTUATION:'פיסוק',CASING:'אות גדולה / קטנה',CONFUSED_WORDS:'מילים שמתבלבלים ביניהן',COLLOCATIONS:'צירוף מילים',REDUNDANCY:'מילה מיותרת',STYLE:'סגנון',TYPOGRAPHY:'טיפוגרפיה',SEMANTICS:'משמעות',MISC:'הערה'};
async function ltCheck(text){
 const body=new URLSearchParams({text,language:'en-US',motherTongue:'he'});
 const r=await withTimeout(fetch('https://api.languagetool.org/v2/check',{method:'POST',body}),9000);
 if(!r.ok)throw new Error('lt');const j=await r.json();
 return (j.matches||[]).filter(m=>m.replacements&&m.replacements.length&&!/WHITESPACE|EN_QUOTES|DASH_RULE/.test(m.rule&&m.rule.id||'')).map(m=>({offset:m.offset,length:m.length,original:text.substr(m.offset,m.length),fixed:m.replacements[0].value,
  explain_he:(LT_CAT[m.rule&&m.rule.category&&m.rule.category.id]||'הערה')+' · '+(m.shortMessage||m.message||'')}));}
async function grammarCheck(text){
 const local=localCheck(text);let lt=[],online=true;
 try{lt=await ltCheck(text);}catch(e){online=false;}
 const all=[...local];
 for(const m of lt){if(!all.some(x=>m.offset<x.offset+x.length&&x.offset<m.offset+m.length))all.push(m);}
 all.sort((a,b)=>a.offset-b.offset||b.length-a.length);
 const clean=[];for(const m of all){const p=clean[clean.length-1];if(!p||m.offset>=p.offset+p.length)clean.push(m);}
 let corrected=text;for(const m of [...clean].reverse())corrected=corrected.slice(0,m.offset)+m.fixed+corrected.slice(m.offset+m.length);
 return{mistakes:clean,corrected,online};}

function scriptTurn(){
 const sc=SCRIPTS[chat.sc.id];
 if(chat.step<sc.lines.length){const [t,he,sample]=sc.lines[chat.step];chat.msgs.push({role:'ai',text:t});addTutorMsg(t,he,sample);return;}

 const bar=$('#cbar');if(bar)bar.innerHTML=`<div class="card" style="flex:1;text-align:center"><b>🎉 סיימת את השיחה!</b> ${chat.ok} מתוך ${sc.lines.length} תשובות בלי טעויות · +15 XP<div class="row" style="justify-content:center;margin-top:10px"><button class="btn primary" onclick="startChat('${chat.sc.id}')">שוב</button><button class="btn ghost" onclick="tutorHome()">תרחיש אחר</button></div></div>`;}
async function sendOffline(t){
 chat.busy=true;const box=$('#chat');
 const ty=document.createElement('div');ty.className='typing';ty.innerHTML='<span class="loader"></span> בודק...';box.appendChild(ty);
 const res=await grammarCheck(t);ty.remove();
 addCorrection(res);if(!res.mistakes.length)chat.ok++;
 record('speaking',!res.mistakes.length,null,null);
 if(res.mistakes.length)addMistake({kind:'chat',ref:t,prompt:t,correct:res.corrected,given:t});save();
 chat.step++;setTimeout(()=>{scriptTurn();chat.busy=false;const ci=$('#cin');if(ci)ci.focus();},700);}
function chatPrompt(){
 const tr=chat.msgs.map(m=>(m.role==='ai'?'Tutor: ':'Learner: ')+m.text).join('\n');
 return `You are a warm, encouraging English tutor for a native Hebrew speaker at CEFR level ${S.level}.
Role-play scenario: ${chat.sc.en}. Stay in character, but stay a supportive teacher.
Write your reply in natural spoken English suited to level ${S.level}: short (1-3 sentences), and end with a question or prompt that keeps the conversation going.
${chat.msgs.length?`If the learner's LAST message has grammar, vocabulary or spelling mistakes, set "correction" to a short Hebrew explanation and "corrected_en" to the corrected English sentence. If it was correct and natural, set both to null.`:'This is the start: open the role-play with a friendly first line. correction and corrected_en are null.'}
Also give "sample": a short example answer the learner could say next.
Conversation so far:
${tr||'(none yet)'}
Return only JSON: {"reply":"your English reply","reply_he":"Hebrew translation of your reply","correction":string|null,"corrected_en":string|null,"sample":"example answer"}`;}
async function tutorTurn(){
 const box=$('#chat');if(!box)return;chat.busy=true;
 const ty=document.createElement('div');ty.className='typing';ty.innerHTML='<span class="loader"></span> המורה מקליד...';box.appendChild(ty);ty.scrollIntoView({block:'end',behavior:'smooth'});
 try{const r=await ai(chatPrompt());ty.remove();
  const last=chat.msgs[chat.msgs.length-1];
  if(last&&last.role==='me'){if(r.correction){const c=document.createElement('div');c.className='corr';c.innerHTML=`✏️ ${esc(r.correction)}${r.corrected_en?`<div class="en" style="margin-top:4px"><b>${esc(r.corrected_en)}</b></div>`:''}`;box.appendChild(c);
    addMistake({kind:'chat',ref:last.text,prompt:last.text,correct:r.corrected_en||r.correction,given:last.text});}
   record('speaking',!r.correction,null,null);}
  chat.msgs.push({role:'ai',text:r.reply||''});addTutorMsg(r.reply||'',r.reply_he||'',r.sample||'');
 }catch(e){ty.remove();
  if(SCRIPTS[chat.sc.id]){chat.offline=true;toast('עוברים לשיחה מודרכת');chat.step=0;scriptTurn();}else aiErr(e);}
 chat.busy=false;const ci=$('#cin');if(ci)ci.focus();}
function sendChat(){
 const cin=$('#cin');if(!cin)return;const t=cin.value.trim();if(!t||chat.busy)return;cin.value='';
 chat.msgs.push({role:'me',text:t});const m=document.createElement('div');m.className='msg me en';m.textContent=t;$('#chat').appendChild(m);
 if(chat.offline)sendOffline(t);else tutorTurn();}

function lookupLocal(word){
 const w=word.toLowerCase().replace(/[^a-z'-]/g,'');if(!w)return null;

 if(storyCtx&&storyCtx.glossary){const g=storyCtx.glossary.find(x=>(x.en||'').toLowerCase()===w);if(g)return{en:g.en,he:g.he};}
 return null;}

  const a=$('#addw');if(a)a.onclick=()=>{let w=known;if(!w){w={en,he,ex:ctx.split(/(?<=[.!?])\s+/).find(s=>s.toLowerCase().includes(word.toLowerCase()))||'',lvl:S.level,tag:'custom',custom:true};S.custom.words.push(w);}

 if(!aiReady()){m.innerHTML=`<div class="card"><span class="loader"></span> מתרגם...</div>`;
  try{const r=await withTimeout(fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(word)+'&langpair=en|he'),8000);const j=await r.json();const he=j&&j.responseData&&j.responseData.translatedText;
   if(he&&!/MYMEMORY|INVALID/i.test(he)&&he.toLowerCase()!==word.toLowerCase())return render(word.toLowerCase(),he,null);}catch(e){}
  m.innerHTML=`<div class="card stack"><div class="row"><span class="big en">${esc(word)}</span>${spk(word)}</div><p class="muted">לא הצלחתי לתרגם את המילה כרגע. בדקו את החיבור לאינטרנט.</p><button class="btn ghost" onclick="$('#modal').hidden=true">סגור</button></div>`;return;}
 m.innerHTML=`<div class="card"><span class="loader"></span> מתרגם...</div>`;
 try{const r=await ai(`Translate the English word "${word}" as used in this text into Hebrew: "${ctx.slice(0,600)}". Return only JSON: {"base":"dictionary form of the word","he":"short Hebrew translation"}`);
  const f=allWords().find(x=>x.en.toLowerCase()===String(r.base||'').toLowerCase());render(r.base||word,r.he||'',f||null);}catch(e){m.hidden=true;aiErr(e);}}

  $$('.opt',el).forEach(b=>b.onclick=()=>{const i=+b.dataset.i,ok=order[i]===a;lockOpts(el,order.indexOf(a),i);ans(ok,{kind:'mcq',correct:o[a],given:o[order[i]],explain});});}};}

/* ====================== DAILY PATH (60 lessons) ====================== */
const PATH_LEN=60;
function pathInfo(){if(!S.path)S.path={n:1,last:null,history:[]};return S.path;}
function pathItems(){
 const P=pathInfo(),n=P.n,L=S.level;
 const base=WORDS.filter(w=>w.lvl===L&&!w.track&&w.tag!=='topic');
 const per=5,start=((n-1)*per)%Math.max(base.length,1);
 let fresh=base.slice(start,start+per).filter(w=>!S.words[w.en]);
 if(fresh.length<3)fresh=fresh.concat(shuffle(base.filter(w=>!S.words[w.en]&&!fresh.includes(w))).slice(0,3-fresh.length));
 const due=allWords().filter(w=>S.words[w.en]&&S.words[w.en].due<=now()&&!fresh.includes(w)).slice(0,3);
 const cz=CLOZE.filter(c=>c.lvl===L);const cs=cz.length?[0,1,2].map(i=>cz[((n-1)*3+i)%cz.length]):[];
 const tr=fromLevel(transPool(),L);const ts=tr.length?[0,1].map(i=>tr[((n-1)*2+i)%tr.length]):[];
 const dp=dictPool(L);
 const quiz=[...fresh.map(w=>()=>makeVocabQ(w,'mcq')),...due.map(w=>()=>makeVocabQ(w)),...cs.map(c=>()=>makeClozeQ(c)),...ts.map(t=>()=>makeTransQ(t)),
  ()=>makeDictQ(dp[(n*7)%dp.length],L),()=>makePairQ(PAIRS[n%PAIRS.length])];
 return fresh.map(w=>()=>makeVocabQ(w,'intro')).concat(shuffle(quiz));}
function startPath(){
 const P=pathInfo();
 if(P.n>PATH_LEN){view(`<div class="card stack" style="text-align:center"><div style="font-size:60px">🏆</div><h1>סיימת את כל 60 השיעורים!</h1><p>כל הכבוד! אפשר להתחיל מסלול חדש ברמה הבאה.</p><button class="btn primary" id="rp">התחל מסלול חדש</button><button class="btn ghost" onclick="home()">לבית</button></div>`);
  $('#rp').onclick=()=>{S.path={n:1,last:null,history:[]};save();startPath();};return;}
 const n=P.n;
 runSession({title:`📅 שיעור ${n} מתוך ${PATH_LEN}`,kind:'path',skill:'vocab',items:pathItems(),onDone:()=>{P.history.push({n,d:dayKey()});P.n=n+1;P.last=dayKey();addXP(20);save();syncClass(true);}});}

const HEB=/[֐-׿]/;
function examWords(t){return t.words.map(en=>allWords().find(w=>w.en.toLowerCase()===en.toLowerCase())).filter(Boolean);}
function examReady(t){const ws=examWords(t);if(!ws.length)return 0;return Math.round(ws.filter(w=>S.words[w.en]&&S.words[w.en].box>=3).length/ws.length*100);}
function daysLeft(d){if(!d)return null;const t=new Date(d+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/DAY);}
function daysTxt(n){if(n===null)return'';if(n<0)return'המבחן עבר';if(n===0)return'המבחן היום! 💪';if(n===1)return'המבחן מחר';return`עוד ${n} ימים`;}
function parseWordLines(txt){
 const out=[];
 for(let line of txt.split(/\n|;/)){line=line.replace(/^\s*\d+[.)]\s*/,'').trim();if(!line)continue;
  let parts=line.split(/\s*(?:\t|=|–|—|:|\s-\s|,)\s*/).filter(Boolean);
  if(parts.length===1&&/\s-/.test(line))parts=line.split('-').map(x=>x.trim()).filter(Boolean);
  let en=parts[0]||'',he=parts.slice(1).join(', ');
  if(HEB.test(en)&&!HEB.test(he)){[en,he]=[he,en];}
  en=en.replace(/[^\w\s'’-]/g,'').trim();if(!en||HEB.test(en))continue;
  out.push({en,he:he.trim()});}
 return out;}
async function fillTranslations(items,onProgress){
 const need=items.filter(x=>!x.he||!x.ex);
 if(!need.length)return items;
 if(aiReady()){try{const r=await ai(`For each English word or phrase below, give a short Hebrew translation (the most common meaning for a student) and one simple example sentence in English (CEFR ${S.level}). Return only a JSON array in the same order: [{"en":"...","he":"...","ex":"..."}]
Words: ${JSON.stringify(need.map(x=>x.en))}`);
  if(Array.isArray(r))need.forEach((x,i)=>{const m=r.find(y=>y&&String(y.en||'').toLowerCase()===x.en.toLowerCase())||r[i];if(m){if(!x.he&&m.he)x.he=m.he;if(!x.ex&&m.ex)x.ex=m.ex;}});
  return items;}catch(e){}}
 let i=0;
 for(const x of need.filter(x=>!x.he)){i++;onProgress&&onProgress(i,need.length);
  try{const r=await withTimeout(fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(x.en)+'&langpair=en|he'),8000);const j=await r.json();const he=j&&j.responseData&&j.responseData.translatedText;
   if(he&&!/MYMEMORY|INVALID/i.test(he)&&he.toLowerCase()!==x.en.toLowerCase())x.he=he;}catch(e){}}
 return items;}
function addWordsToTest(t,items){
 let added=0;
 for(const x of items){if(!x.en)continue;const key=x.en.toLowerCase();
  let w=allWords().find(y=>y.en.toLowerCase()===key);
  if(!w){if(!x.he)continue;w={en:x.en,he:x.he,ex:x.ex||'',lvl:S.level,tag:'custom',custom:true,topic:'exam:'+t.id};S.custom.words.push(w);}
  if(!t.words.some(e=>e.toLowerCase()===key)){t.words.push(w.en);added++;}}
 save();return added;}

 const ws=examWords(t);if(!ws.length)return examEdit(id);
 if(mode==='learn'){const weak=ws.filter(w=>!S.words[w.en]||S.words[w.en].box<3);const pick=(weak.length?weak:shuffle(ws)).slice(0,10);
  return runSession({title:`📚 ${t.name}`,kind:'exam-learn-'+id,skill:'vocab',items:vocabItems(10,pick),onDone:()=>{}});}
 if(mode==='listen')return runSession({title:`🎧 ${t.name}`,kind:'exam-listen-'+id,skill:'listening',items:shuffle(ws).slice(0,10).map(w=>()=>makeVocabQ(w,'listen'))});
 const qs=shuffle(ws).slice(0,Math.min(20,ws.length)).map((w,i)=>()=>makeVocabQ(w,i%3===2?'spell':'mcq'));
 runSession({title:`🎯 מבחן לדוגמה · ${t.name}`,kind:'exam-test-'+id,skill:'vocab',items:qs,onDone:ses=>{t.lastScore=Math.round(ses.ok/Math.max(1,ses.answered)*100);save();}});}
function examCards(id,i,flipped){
 const t=(S.tests||[]).find(x=>x.id===id);if(!t)return examHome();const ws=examWords(t);if(!ws.length)return examEdit(id);
 i=(i+ws.length)%ws.length;const w=ws[i];
 view(`<div class="stack"><div class="ses-head"><button class="iconbtn" onclick="examView('${id}')">✕</button><div class="bar"><i style="width:${(i+1)/ws.length*100}%"></i></div><span class="muted small">${i+1}/${ws.length}</span></div>
 <button class="card" id="cardf" style="min-height:260px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px">
 ${flipped?`<div class="he-big">${esc(w.he)}</div>${w.ex?`<div class="en muted">${esc(w.ex)}</div>`:''}`:`<div class="big en">${esc(w.en)}</div>`}<div class="small muted">לחצו כדי ${flipped?'לחזור':'לראות תרגום'}</div></button>
 <div class="row" style="justify-content:center">${spk(w.en)}<button class="btn ghost" id="cprev">→ הקודמת</button><button class="btn primary" id="cnext">הבאה ←</button></div>
 <div class="row" style="justify-content:center"><button class="btn ghost small" id="cknow">✅ יודעת</button><button class="btn ghost small" id="cdont">❌ עוד לא</button></div></div>`,'cards');
 if(!flipped&&S.settings.autoSpeak)setTimeout(()=>speak(w.en),200);
 $('#cardf').onclick=()=>examCards(id,i,!flipped);
 $('#cprev').onclick=()=>examCards(id,i-1,false);$('#cnext').onclick=()=>examCards(id,i+1,false);
 $('#cknow').onclick=()=>{srs(w.en,true);save();examCards(id,i+1,false);};
 $('#cdont').onclick=()=>{srs(w.en,false);save();examCards(id,i+1,false);};}

/* ====================== BOOT ====================== */
refreshCaps();renderTop();home();restoreBackup();setTimeout(()=>syncClass(true),3000);
</script>
