<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuki – לימוד אנגלית</title>
<meta name="theme-color" content="#0e7c6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tuki">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1ea; --card:#fffdf9; --ink:#1d2433; --muted:#6b7280; --line:#e7e0d4;
  --pri:#0e7c6b; --pri-2:#0a5c50; --pri-soft:#e1f2ee;
  --acc:#f2a93b; --acc-soft:#fdf0db;
  --good:#16a34a; --good-soft:#e6f6ea; --bad:#dc2626; --bad-soft:#fde8e8;
  --r:18px; --shadow:0 1px 2px rgba(29,36,51,.05),0 6px 20px rgba(29,36,51,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Rubik,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
.en{direction:ltr;unicode-bidi:isolate}
#top{position:sticky;top:0;z-index:10;background:rgba(245,241,234,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;cursor:pointer}
.brand .logo{width:34px;height:34px;border-radius:10px;display:block}
.chips{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip.lvl{background:var(--pri);color:#fff;border-color:var(--pri)}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px}
.iconbtn:hover{background:var(--card)}
main{max-width:760px;margin:0 auto;padding:18px 16px 80px}
h1{font-size:28px;margin:6px 0 4px;letter-spacing:-.5px}
h2{font-size:22px;margin:4px 0 12px}
h3{font-size:17px;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.mod{text-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s;display:flex;flex-direction:column;gap:4px;min-height:118px}
.mod:hover{transform:translateY(-2px);border-color:var(--pri)}
.mod .ic{font-size:26px}
.mod .t{font-weight:700}
.mod .d{font-size:13px;color:var(--muted)}
.mod .ai{font-size:11px;font-weight:700;color:var(--pri);background:var(--pri-soft);border-radius:6px;padding:1px 6px;align-self:flex-start;margin-top:auto}
.hero{background:linear-gradient(135deg,var(--pri),#13967f);color:#fff;border:0}
.hero .muted{color:rgba(255,255,255,.8)}
.hero-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:74px;height:74px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 18px;font-weight:600;transition:background .12s,transform .08s}
.btn:active{transform:scale(.98)}
.primary{background:var(--pri);color:#fff}
.primary:hover{background:var(--pri-2)}
.light{background:#fff;color:var(--pri)}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.ghost:hover{background:var(--card)}
.accent{background:var(--acc);color:#3b2600}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.wide{width:100%}
.wotd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wotd .w{font-size:24px;font-weight:700}
.spk{width:42px;height:42px;border-radius:50%;background:var(--pri-soft);color:var(--pri);font-size:18px;display:inline-grid;place-items:center;flex:none}
.spk:hover{background:#cfe9e2}
.spk.sm{width:32px;height:32px;font-size:14px}
.ses-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .3s}
.ses-title{font-size:15px;color:var(--muted);font-weight:600;margin:0 0 10px}
.prompt{display:flex;align-items:center;gap:14px;justify-content:center;padding:22px 10px;flex-wrap:wrap}
.big{font-size:36px;font-weight:700;letter-spacing:-.5px}
.he-big{font-size:28px;font-weight:700}
.opts{display:grid;gap:10px;margin-top:10px}
@media(min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px 16px;text-align:start;font-weight:500;font-size:17px;transition:border-color .1s,background .1s}
.opt:hover:not([disabled]){border-color:var(--pri)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.sentence{font-size:22px;font-weight:500;text-align:center;padding:18px 6px;line-height:1.7}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--acc);color:var(--pri);font-weight:700;padding:0 6px}
.inp{width:100%;border:2px solid var(--line);border-radius:14px;padding:13px 15px;font-size:18px;background:#fff;outline:none}
.inp:focus{border-color:var(--pri)}
textarea.inp{min-height:150px;resize:vertical;line-height:1.6}
.fb{margin-top:14px;border-radius:var(--r);padding:16px;animation:pop .2s ease-out}
.fb.good{background:var(--good-soft);border:1px solid #bfe5c9}
.fb.bad{background:var(--bad-soft);border:1px solid #f5c2c2}
.fb-h{font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.fb .xp{font-size:13px;background:#fff;border-radius:99px;padding:2px 10px;color:var(--pri)}
.fb>*+*{margin-top:8px}
.explain{background:rgba(255,255,255,.7);border-radius:12px;padding:10px 12px;font-size:15px}
.ex{display:flex;gap:8px;align-items:center;justify-content:flex-end;font-size:16px}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.mic{background:var(--acc);color:#3b2600;border-radius:999px;padding:12px 20px;font-weight:700;display:inline-flex;gap:8px;align-items:center}
.mic.rec{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}100%{box-shadow:0 0 0 14px rgba(220,38,38,0)}}
.heard{min-height:28px;font-size:18px;text-align:center;color:var(--pri-2);font-weight:500;margin-top:8px}
.needs-mic,.needs-ai{display:none!important}
body.has-mic .needs-mic{display:inline-flex!important}
body.has-ai .needs-ai{display:inline-flex!important}
body.has-mic .no-mic,body.has-ai .no-ai{display:none!important}
.note{background:var(--acc-soft);border:1px solid #f4d7a6;border-radius:14px;padding:12px 14px;font-size:14px}
.w-ok{color:var(--good);font-weight:600}
.w-miss{color:var(--bad);font-weight:700;text-decoration:underline wavy}
.diff{font-size:18px;line-height:1.9;background:#fff;border-radius:12px;padding:8px 12px}
.pill{display:inline-block;background:var(--pri-soft);color:var(--pri-2);border-radius:99px;padding:3px 12px;font-size:14px;font-weight:600}
.lvlpick{display:flex;gap:8px;flex-wrap:wrap}
.lvlpick button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;text-align:center;min-width:92px}
.lvlpick button b{display:block;font-size:20px}
.lvlpick button.on,.lvlpick button:hover{border-color:var(--pri);background:var(--pri-soft)}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:280px}
.msg{max-width:86%;padding:11px 14px;border-radius:18px;font-size:16px;animation:pop .2s}
.msg.ai{align-self:flex-end;background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.me{align-self:flex-start;background:var(--pri);color:#fff;border-bottom-right-radius:6px}
.msg .tools{display:flex;gap:6px;margin-top:6px;justify-content:flex-end}
.msg .tr{font-size:14px;color:var(--muted);margin-top:6px;direction:rtl}
.corr{align-self:flex-start;max-width:86%;background:var(--acc-soft);border:1px solid #f4d7a6;border-radius:14px;padding:8px 12px;font-size:14px}
.chatbar{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:flex;gap:8px;align-items:center}
.chatbar .inp{font-size:16px;padding:11px 14px}
.typing{align-self:flex-end;color:var(--muted);font-size:14px}
.scen{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
/* stories */
.story{font-size:19px;line-height:1.9}
.tw{cursor:pointer;border-radius:4px;padding:0 1px}
.tw:hover{background:var(--acc-soft)}
.tw.known{border-bottom:2px dotted var(--pri)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(20,24,33,.45);display:grid;place-items:center;z-index:50;padding:16px}
#modal[hidden]{display:none}
#modal .card{max-width:420px;width:100%;animation:pop .15s}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.stat{display:flex;flex-direction:column;align-items:center;padding:14px;text-align:center}
.stat b{font-size:28px}
.sbar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;flex:1}
.sbar i{display:block;height:100%;background:var(--pri)}
.week{display:flex;gap:8px;align-items:flex-end;height:120px;padding-top:10px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:12px;color:var(--muted)}
.week i{width:100%;background:var(--pri);border-radius:6px 6px 2px 2px;min-height:3px}
.mist{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.mist:last-child{border:0}
.tag{font-size:12px;background:var(--line);border-radius:6px;padding:1px 7px;color:var(--muted);white-space:nowrap}
.tip-ex{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:6px}
.loader{display:inline-block;width:18px;height:18px;border:3px solid var(--pri-soft);border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.fbtn{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
label.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
select.inp{width:auto;font-size:15px;padding:8px 12px}
@media(max-width:480px){.big{font-size:30px}.chip.hide-sm{display:none}h1{font-size:24px}}
</style>
</head>

<div id="toast"></div>

const KEY='speakup.v1';/* Tuki */
const DAY=864e5, now=()=>Date.now();
const dayKey=(off=0)=>{const d=new Date(Date.now()+off*DAY);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
function defaultState(){return{v:1,level:'A1',placementDone:false,xp:0,streak:0,lastDay:null,todayXP:0,xpDay:null,history:{},goal:100,
 settings:{rate:1,voice:'buttery',autoSpeak:true},words:{},

 recent:[],mistakes:[],custom:{words:[],cloze:[],trans:[]},updatedAt:0};}
function merge(o){const d=defaultState();const s=Object.assign(d,o||{});s.settings=Object.assign(defaultState().settings,s.settings||{});s.stats=Object.assign(defaultState().stats,s.stats||{});s.custom=Object.assign(defaultState().custom,s.custom||{});return s;}
let S=defaultState();
try{const t=localStorage.getItem(KEY);if(t)S=merge(JSON.parse(t));}catch(e){}
let dbRef=null,saveTimer=null,writing=false,pendingWrite=false;
function save(){S.updatedAt=now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}clearTimeout(saveTimer);saveTimer=setTimeout(pushDb,1500);}
async function pushDb(){if(!dbRef)return;if(writing){pendingWrite=true;return;}writing=true;
 try{await dbRef.set({json:JSON.stringify(S),updatedAt:S.updatedAt});}catch(e){console.warn('db write',e);}
 writing=false;if(pendingWrite){pendingWrite=false;pushDb();}}
function snapData(s){if(!s)return null;if(typeof s.data==='function')return s.data();if(s.exists===false)return null;if(s.data&&typeof s.data==='object')return s.data;return s;}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);

/* ====================== CAPABILITIES ====================== */
let ttsCap=null,dictCap=null,sampleCap=null,aiState='pending';
function refreshCaps(){document.body.classList.toggle('has-mic',!!dictCap);document.body.classList.toggle('has-ai',!!sampleCap);}
function initCaps(tries=0){
 if(!(window.claude&&typeof window.claude.use==='function')){if(tries<20)setTimeout(()=>initCaps(tries+1),250);else aiState='none';return;}
 const c=window.claude;
 c.use('tts').then(t=>{ttsCap=t;if(t&&t.onState)t.onState(()=>{});}).catch(()=>{});
 c.use('dictation').then(d=>{dictCap=d;if(d)wireDictation(d);refreshCaps();}).catch(()=>{});
 c.use('sample').then(s=>{sampleCap=s;aiState=s?'ok':'none';refreshCaps();}).catch(()=>{aiState='none';});
 initDb(c);
}
async function initDb(c){
 try{const [db,user]=await Promise.all([c.use('db'),c.use('user')]);if(!db||!user)return;
  const id=await withTimeout(Promise.resolve(user.id()),10000);if(!id)return;
  const ref=db.collection('data/users/'+id).doc('state');
  const d=snapData(await withTimeout(ref.get(),10000));
  if(d&&d.json&&(d.updatedAt||0)>(S.updatedAt||0)){
   S=merge(JSON.parse(d.json));try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
   renderTop();if(currentView==='home'||currentView==='welcome')home();
  }
  dbRef=ref;if(!d||(d.updatedAt||0)<(S.updatedAt||0))pushDb();
 }catch(e){console.warn('db',e);}
}

/* speech out */
function speak(text,slow){
 if(!text)return;const rate=slow?0.7:S.settings.rate;
 if(ttsCap){ttsCap.speak(text,{language:'en',rate,voice:S.settings.voice}).catch(e=>{
   if(e&&(e.code==='not_granted'))ttsCap=null;
   if(e&&(e.code==='busy'||e.code==='viewer_stopped'))return;
   if(!e||e.code!=='busy')browserSpeak(text,rate);});return;}
 browserSpeak(text,rate);
}
function browserSpeak(text,rate){
 try{if(!('speechSynthesis' in window)){toast('הקראה לא זמינה בדפדפן הזה');return;}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;
  const v=speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));if(v)u.voice=v;
  speechSynthesis.speak(u);}catch(e){}
}
function stopSpeak(){try{ttsCap&&ttsCap.stop&&ttsCap.stop();}catch(e){}try{speechSynthesis.cancel();}catch(e){}}

/* speech in */
let curListen=null;
function wireDictation(d){
 d.onPartial(({text})=>{if(!curListen)return;clearTimeout(curListen.timer);curListen.partial((curListen.final+' '+text).trim());if(curListen.final)curListen.timer=setTimeout(()=>d.stop().catch(()=>{}),1400);});
 d.onFinal(({text})=>{if(!curListen)return;curListen.final=(curListen.final+' '+text).trim();curListen.partial(curListen.final);clearTimeout(curListen.timer);curListen.timer=setTimeout(()=>d.stop().catch(()=>{}),1100);});
 d.onState(({state,reason})=>{if(!curListen)return;const c=curListen;
  if(state==='listening'){c.btn.classList.add('rec');c.btn.innerHTML='⏹ מקשיב... לחץ לסיום';}
  else if(state==='idle'){clearTimeout(c.timer);curListen=null;c.btn.classList.remove('rec');c.btn.innerHTML=c.label;c.done(c.final.trim(),reason);}});
}
function toggleListen(btn,onPartial,onDone){
 if(!dictCap){toast('זיהוי דיבור זמין ב-Chrome או באפליקציית Claude למחשב');return;}
 if(curListen){dictCap.stop().catch(()=>{});return;}
 stopSpeak();
 curListen={btn,label:btn.innerHTML,final:'',partial:onPartial,done:onDone,timer:null};
 dictCap.start().catch(e=>{const c=curListen;curListen=null;if(c){c.btn.classList.remove('rec');c.btn.innerHTML=c.label;}
  if(e&&e.code==='not_granted'){dictCap=null;refreshCaps();toast('אין הרשאה למיקרופון – אפשר להמשיך בלי דיבור');}
  else toast('לא הצלחתי להפעיל את המיקרופון, נסה שוב');});
}
function micUI(el,onDone){
 const btn=el.querySelector('.mic'),heard=el.querySelector('.heard');if(!btn)return;
 btn.onclick=()=>toggleListen(btn,t=>{heard.textContent=t;},(t)=>{heard.textContent=t||'(לא נשמע דיבור, נסה שוב)';if(t)onDone(t);});
}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const spk=(t,cls='')=>`<button class="spk ${cls}" data-say="${esc(t)}" title="הקשב">🔊</button>`;

function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
const sim=(a,b)=>{const L=Math.max(a.length,b.length);return L?1-lev(a,b)/L:1;};
function normEn(s){s=String(s||'').toLowerCase().replace(/[’‘`]/g,"'");
 s=s.replace(/\bcan't\b/g,'cannot').replace(/\bwon't\b/g,'will not').replace(/n't\b/g,' not').replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'ve\b/g,' have').replace(/'ll\b/g,' will').replace(/'d\b/g,' would').replace(/\b(it|that|there|what|he|she|where|who|here)'s\b/g,'$1 is').replace(/\bcan not\b/g,'cannot').replace(/\bi've got\b/g,'i have got');
 return s.replace(/[^a-z0-9' ]+/g,' ').replace(/'/g,'').replace(/\s+/g,' ').trim();}
function normHe(s){return String(s||'').replace(/[֑-ׇ]/g,'').replace(/["'״׳.,!?;:()\-–־]/g,' ').replace(/\s+/g,' ').trim();}
function bestMatch(given,acc,norm){let best=0,idx=0;const g=norm(given);acc.forEach((a,i)=>{const s=sim(g,norm(a));if(s>best){best=s;idx=i;}});return{best,idx};}
function wordDiff(target,given){
 const Tw=normEn(target).split(' ').filter(Boolean),G=normEn(given).split(' ').filter(Boolean);const m=Tw.length,n=G.length;
 const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
 for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)dp[i][j]=Tw[i]===G[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
 const hit=new Array(m).fill(false);let i=0,j=0;while(i<m&&j<n){if(Tw[i]===G[j]){hit[i]=true;i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++;}
 return{ratio:m?dp[0][0]/Math.max(m,n):0,html:Tw.map((w,k)=>`<span class="${hit[k]?'w-ok':'w-miss'}">${esc(w)}</span>`).join(' ')};}
function saidWord(heard,target){const h=normEn(heard),t=normEn(target);if(!h)return false;if(h===t||(' '+h+' ').includes(' '+t+' '))return true;return h.split(' ').some(w=>sim(w,t)>=0.8)||sim(h,t)>=0.8;}

function computeStreak(){if(S.lastDay===dayKey()||S.lastDay===dayKey(-1))return S.streak;return 0;}

/* ====================== PROGRESS / ADAPTIVE ====================== */
function addXP(n){
 const t=dayKey();if(S.xpDay!==t){S.xpDay=t;S.todayXP=0;}
 if(S.lastDay!==t){S.streak=(S.lastDay===dayKey(-1))?S.streak+1:1;S.lastDay=t;}
 const before=S.todayXP;S.xp+=n;S.todayXP+=n;S.history[t]=(S.history[t]||0)+n;
 if(before<S.goal&&S.todayXP>=S.goal)setTimeout(()=>toast('🎉 השלמת את היעד היומי! כל הכבוד'),400);
 save();renderTop();}
function record(skill,ok,lvl,info){
 const st=S.stats[skill]||(S.stats[skill]=[0,0]);st[1]++;if(ok)st[0]++;
 if(lvl&&lvl===S.level){S.recent.push(ok?1:0);if(S.recent.length>16)S.recent.shift();adapt();}
 if(info&&info.ref){if(!ok)addMistake(info);else removeMistake(info.kind,info.ref);}
 const xp=ok?10:2;addXP(xp);return xp;}
function adapt(){
 const r=S.recent,acc=r.reduce((a,b)=>a+b,0)/r.length,i=lvlIdx(S.level);
 if(r.length>=12&&acc>=0.85&&i<4){S.level=LEVELS[i+1];S.recent=[];setTimeout(()=>toast(`🚀 עלית לרמה ${S.level} – ${LVL_HE[S.level]}!`),500);}
 else if(r.length>=10&&acc<0.45&&i>0){S.level=LEVELS[i-1];S.recent=[];setTimeout(()=>toast(`התאמנו את הרמה ל-${S.level} כדי שיהיה נוח יותר 💪`),500);}}
function addMistake(info){S.mistakes=S.mistakes.filter(m=>!(m.kind===info.kind&&m.ref===info.ref));
 S.mistakes.unshift({kind:info.kind,ref:info.ref,dir:info.dir||null,prompt:info.prompt,correct:info.correct,given:info.given||'',t:now()});S.mistakes=S.mistakes.slice(0,150);}
function removeMistake(kind,ref){S.mistakes=S.mistakes.filter(m=>!(m.kind===kind&&m.ref===ref));}
const INT=[0,10*60e3,DAY,3*DAY,7*DAY,16*DAY,35*DAY];
function srs(en,ok){const r=S.words[en]||(S.words[en]={box:0,due:0,ok:0,bad:0});if(ok){r.box=Math.min(6,r.box+1);r.ok++;}else{r.box=1;r.bad++;}r.due=now()+INT[r.box];}

function startPlacement(){

 const score={};LEVELS.forEach(l=>score[l]=0);let i=0;
 const finish=()=>{let lv='A1';for(const l of LEVELS){if(score[l]>=2)lv=l;else break;}
  view(`<div class="card stack" style="text-align:center"><div style="font-size:54px">🎓</div><h1>הרמה שלך: ${lv}</h1><p class="pill" style="font-size:16px">${LVL_HE[lv]}</p>

  $('#go').onclick=()=>setLevel(lv);};
 const step=()=>{
  if(i>0&&i%3===0&&score[qs[i-1].lvl]<=1)return finish();
  if(i>=qs.length)return finish();
  const cur=qs[i];
  view(`<div class="ses-head"><button class="iconbtn" onclick="welcome()">✕</button><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><span class="muted small">${i+1}/${qs.length}</span></div><h2 class="ses-title">🎯 מבחן רמה</h2><div id="q" class="card"></div>`);
  let done=false;cur.q.render($('#q'),ok=>{if(done)return;done=true;if(ok)score[cur.lvl]++;i++;setTimeout(step,700);});
 };step();}

const PRAISE=['מעולה! ✓','כל הכבוד! ✓','בדיוק! ✓','יפה מאוד! ✓','מצוין! ✓'];
function runSession({title,items,kind,skill}){
 const ses={i:0,ok:0,n:items.length,xp:0,answered:0};
 if(!ses.n){view(`<div class="card stack"><h2>${title}</h2><p>אין כרגע פריטים לתרגול כאן.</p><button class="btn primary" onclick="home()">חזרה</button></div>`);return;}
 const summary=()=>{const pct=ses.answered?Math.round(ses.ok/ses.answered*100):100;
  view(`<div class="card stack" style="text-align:center"><div style="font-size:54px">${pct>=80?'🏆':pct>=50?'👏':'💪'}</div><h1>סיימת!</h1>
  <p style="font-size:18px">${ses.ok} מתוך ${ses.answered} נכונות · <b>+${ses.xp} XP</b></p>
  <div class="row" style="justify-content:center"><button class="btn primary" id="again">עוד סבב</button><button class="btn ghost" onclick="home()">לבית</button></div>
  ${(kind==='cloze'||kind==='trans')?`<div class="needs-ai" style="justify-content:center"><button class="btn accent" id="moreai">✨ צור לי תרגילים חדשים עם AI</button></div>`:''}
  </div>`);
  $('#again').onclick=()=>open_(kind);const m=$('#moreai');if(m)m.onclick=()=>aiMore(kind,m);};
 const next=()=>{
  while(ses.i<ses.n){const q=items[ses.i++]();if(q)return show(q);}
  summary();};
 const show=q=>{
  view(`<div class="ses-head"><button class="iconbtn" title="יציאה" onclick="home()">✕</button><div class="bar"><i style="width:${(ses.i-1)/ses.n*100}%"></i></div><span class="muted small">${ses.i}/${ses.n}</span></div>
  <h2 class="ses-title">${title}</h2><div id="q" class="card"></div><div id="fb"></div>`,'session');
  let answered=false;
  q.render($('#q'),(ok,info={})=>{
   if(answered)return;answered=true;
   if(info.intro){addXP(3);ses.xp+=3;return next();}
   ses.answered++;if(ok)ses.ok++;
   const sk=q.skill||skill;const xp=record(sk,ok,q.lvl,info);ses.xp+=xp;
   feedback(ok,info,xp,sk,next,()=>{ses.ok++;});
  });};
 next();}
function feedback(ok,info,xp,skill,next,onOverride){
 const fb=$('#fb');const isHe=/[֐-׿]/.test(info.correct||'');
 fb.innerHTML=`<div class="fb ${ok?'good':'bad'}"><div class="fb-h"><span>${ok?(info.almost?'כמעט מושלם ✓':pick(PRAISE)):'לא הפעם ✗'}</span><span class="xp">+${xp} XP</span></div>
 ${(!ok||info.almost)&&info.correct?`<div>${info.almost?'הנוסח המדויק':'התשובה הנכונה'}: <b class="${isHe?'':'en'}">${esc(info.correct)}</b> ${!isHe?spk(info.correct,'sm'):''}</div>`:''}
 ${info.explain?`<div class="explain">💡 ${esc(info.explain)}</div>`:''}${info.extra||''}
 ${!ok&&info.aiCheck?`<div class="needs-ai"><button class="btn ghost" id="aichk">🤖 חושב שהתשובה שלך נכונה? בדוק עם AI</button></div><div id="aires"></div>`:''}
 <div class="fbtn"><button class="btn primary" id="nextb">המשך ←</button></div></div>`;
 const nb=$('#nextb');nb.onclick=next;setTimeout(()=>nb.focus(),30);
 const ac=$('#aichk');if(ac)ac.onclick=async()=>{ac.disabled=true;ac.innerHTML='<span class="loader"></span> בודק...';
  try{const r=await info.aiCheck();$('#aires').innerHTML=`<div class="explain">${r.correct?'✅ ':'❌ '}${esc(r.feedback_he||'')}</div>`;
   if(r.correct){S.stats[skill][0]++;removeMistake(info.kind,info.ref);addXP(8);onOverride();toast('התשובה נספרה כנכונה ✓');}
   ac.remove();}catch(e){aiErr(e);ac.disabled=false;ac.textContent='🤖 נסה שוב';}};
}

function distractors(w,k,field){const same=allWords().filter(x=>x.en!==w.en&&x[field]!==w[field]&&x.lvl===w.lvl);const rest=allWords().filter(x=>x.en!==w.en&&x[field]!==w[field]);
 const out=shuffle(same).slice(0,k);for(const x of shuffle(rest)){if(out.length>=k)break;if(!out.includes(x))out.push(x);}return out;}
function makeVocabQ(w,type,noSrs){
 const r=S.words[w.en];
 if(!type){const box=r?r.box:0;const opts=box<=2?['mcq','mcq','listen','spell']:['mcq','listen','spell','spell'];if(dictCap)opts.push('say');type=pick(opts);}
 const base={lvl:w.lvl,skill:type==='listen'?'listening':type==='say'?'speaking':'vocab'};
 const done=(ans,ok,given)=>{if(!noSrs)srs(w.en,ok);ans(ok,{kind:'vocab',ref:w.en,prompt:w.en,correct:type==='mcq'?w.he:w.en,given,
   extra:`<div class="explain"><b class="en">${esc(w.en)}</b> = ${esc(w.he)}<div class="ex en">${esc(w.ex)} ${spk(w.ex,'sm')}</div></div>`});};

function makeTransQ(t,dir){
 dir=dir||(Math.random()<0.6?'he2en':'en2he');
 const src=dir==='he2en'?t.he[0]:t.en[0],acc=dir==='he2en'?t.en:t.he,norm=dir==='he2en'?normEn:normHe;

  <input class="inp ${dir==='he2en'?'en':''}" id="in" autocomplete="off" spellcheck="false" placeholder="${dir==='he2en'?'Type in English...':'כתוב בעברית...'}">

  const inp=$('#in',el);setTimeout(()=>inp.focus(),50);
  const info=(g,ok,almost,idx)=>({kind:'trans',ref:t.he[0]+'|'+dir,dir,prompt:src,correct:acc[idx],given:g,almost,
   explain:acc.length>1?'גם נכון: '+acc.filter((_,i)=>i!==idx).join(' / '):'',
   aiCheck:g?()=>ai(`A native Hebrew speaker learning English (CEFR ${S.level}) translated this sentence.\nSource (${dir==='he2en'?'Hebrew':'English'}): "${src}"\nTheir ${dir==='he2en'?'English':'Hebrew'} translation: "${g}"\nReference translations: ${JSON.stringify(acc)}\nIs their translation correct and natural enough to be accepted (meaning preserved, grammar correct; minor stylistic differences are fine)? Return only JSON: {"correct": boolean, "feedback_he": "one or two short sentences in Hebrew explaining why, and the fix if wrong"}`):null});
  const check=()=>{const g=inp.value.trim();if(!g)return;const {best,idx}=bestMatch(g,acc,norm);const ok=best>=0.85;inp.disabled=true;ans(ok,info(g,ok,ok&&best<0.97,idx));};
  $('#chk',el).onclick=check;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check();}};
  $('#idk',el).onclick=()=>{inp.disabled=true;ans(false,info('',false,false,0));};}};}

function vocabItems(n=10,only){
 const t=now(),li=lvlIdx(S.level);
 const pool=allWords().filter(w=>lvlIdx(w.lvl)<=li||w.custom);
 const due=pool.filter(w=>S.words[w.en]&&S.words[w.en].due<=t).sort((a,b)=>S.words[a.en].due-S.words[b.en].due);
 let fresh=only?only.filter(w=>!S.words[w.en]||S.words[w.en].box===0):shuffle(pool.filter(w=>!S.words[w.en])).sort((a,b)=>(b.lvl===S.level)-(a.lvl===S.level));
 fresh=fresh.slice(0,only?10:4);
 const quiz=[...fresh.map(w=>({w})),...due.slice(0,n).map(w=>({w}))];
 if(only)only.filter(w=>!fresh.includes(w)).forEach(w=>quiz.push({w}));
 const seen=shuffle(pool.filter(w=>S.words[w.en]&&!due.includes(w)));while(quiz.length<n-fresh.length&&seen.length)quiz.push({w:seen.pop()});
 const intro=fresh.map(w=>({w,type:'intro'}));const qz=quiz.slice(0,Math.max(n-intro.length,fresh.length));
 // keep new-word quizzes after their intros
 const out=[];const freshQ=qz.filter(x=>fresh.includes(x.w)),otherQ=shuffle(qz.filter(x=>!fresh.includes(x.w)));
 intro.forEach((x,i)=>{out.push(x);if(otherQ.length)out.push(otherQ.shift());if(i>0&&freshQ.length)out.push(freshQ.shift());});
 out.push(...shuffle(freshQ.concat(otherQ)));
 return out.map(x=>()=>makeVocabQ(x.w,x.type));}
function startVocab(only){runSession({title:'📚 אוצר מילים',kind:'vocab',skill:'vocab',items:vocabItems(10,only)});}
function clozeItems(n){const used=new Set();return Array.from({length:n},()=>()=>{const p=fromLevel(clozePool(),pickLevel()).filter(c=>!used.has(c.s));const c=pick(p.length?p:clozePool());used.add(c.s);return makeClozeQ(c);});}
function transItems(n){const used=new Set();return Array.from({length:n},()=>()=>{const p=fromLevel(transPool(),pickLevel()).filter(t=>!used.has(t.he[0]));const t=pick(p.length?p:transPool());used.add(t.he[0]);return makeTransQ(t);});}
function dictItems(n){const used=new Set();return Array.from({length:n},()=>()=>{const l=pickLevel();const p=dictPool(l).filter(s=>!used.has(s));const s=pick(p);used.add(s);return makeDictQ(s,l);});}
function startCloze(){runSession({title:'🧩 השלמת משפטים',kind:'cloze',skill:'grammar',items:clozeItems(10)});}
function startTrans(){runSession({title:'🔁 תרגום',kind:'trans',skill:'translate',items:transItems(8)});}
function startDict(){runSession({title:'🎧 הכתבה',kind:'dict',skill:'listening',items:dictItems(8)});}
function startPairs(){const ps=shuffle(PAIRS);runSession({title:'👂 הגייה – זוגות מילים',kind:'pairs',skill:'listening',items:ps.slice(0,10).map(p=>()=>makePairQ(p))});}

  $('#sh').innerHTML=shuffle(dictPool(S.level)).slice(0,5).map(s=>`<div class="ex en" style="justify-content:flex-start;padding:6px 0">${spk(s,'sm')} ${spkSlow(s)} ${esc(s)}</div>`).join('');return;}

function chatPrompt(){

 return `You are a warm, encouraging English tutor for a native Hebrew speaker at CEFR level ${S.level}.
Role-play scenario: ${chat.sc.en}. Stay in character, but stay a supportive teacher.
Write your reply in natural spoken English suited to level ${S.level}: short (1-3 sentences), and end with a question or prompt that keeps the conversation going.
${chat.msgs.length?`If the learner's LAST message has grammar, vocabulary or spelling mistakes, set "correction" to a short Hebrew explanation and "corrected_en" to the corrected English sentence. If it was correct and natural, set both to null.`:'This is the start: open the role-play with a friendly first line. correction and corrected_en are null.'}
Conversation so far:
${tr||'(none yet)'}
Return only JSON: {"reply":"your English reply","reply_he":"Hebrew translation of your reply","correction":string|null,"corrected_en":string|null}`;}
async function tutorTurn(){

 const ty=document.createElement('div');ty.className='typing';ty.innerHTML='<span class="loader"></span> המורה מקליד...';box.appendChild(ty);ty.scrollIntoView({block:'end',behavior:'smooth'});
 try{const r=await ai(chatPrompt(),'default');ty.remove();

function lookupLocal(word){
 const w=word.toLowerCase().replace(/[^a-z'-]/g,'');if(!w)return null;
 const cands=[w,w.replace(/'s$/,''),w.replace(/s$/,''),w.replace(/es$/,''),w.replace(/ed$/,''),w.replace(/d$/,''),w.replace(/ing$/,''),w.replace(/ing$/,'e'),w.replace(/ies$/,'y'),w.replace(/ly$/,'')];
 for(const c of cands){const f=allWords().find(x=>x.en.toLowerCase()===c);if(f)return f;}
 if(storyCtx&&storyCtx.glossary){const g=storyCtx.glossary.find(x=>(x.en||'').toLowerCase()===w);if(g)return{en:g.en,he:g.he};}
 return null;}

async function wordPopup(raw,ctx){
 const word=raw.replace(/[^A-Za-z'-]/g,'');if(!word)return;

 const local=lookupLocal(word);
 const render=(en,he,known)=>{m.innerHTML=`<div class="card stack"><div class="row"><span class="big en">${esc(en)}</span>${spk(en)}<button class="iconbtn" style="margin-inline-start:auto" onclick="$('#modal').hidden=true">✕</button></div>
  <div class="he-big">${esc(he)}</div><div class="row">${known&&S.words[known.en]?'<span class="pill">✓ ברשימת התרגול</span>':`<button class="btn primary" id="addw">➕ הוסף לתרגול</button>`}</div></div>`;
  const a=$('#addw');if(a)a.onclick=()=>{let w=known;if(!w){w={en,he,ex:ctx.split(/(?<=[.!?])\s+/).find(s=>s.toLowerCase().includes(word.toLowerCase()))||'',lvl:S.level,tag:'custom',custom:true};S.custom.words.push(w);}
   S.words[w.en]={box:1,due:now(),ok:0,bad:0};save();toast('נוספה לתרגול ✓');m.hidden=true;};};
 speak(word);
 if(local)return render(local.en,local.he,local);
 if(!sampleCap){m.innerHTML=`<div class="card stack"><div class="row"><span class="big en">${esc(word)}</span>${spk(word)}</div><p class="muted">המילה לא נמצאת במילון המקומי. תרגום עם AI זמין ב-claude.ai.</p><button class="btn ghost" onclick="$('#modal').hidden=true">סגור</button></div>`;return;}
 m.innerHTML=`<div class="card"><span class="loader"></span> מתרגם...</div>`;
 try{const r=await ai(`Translate the English word "${word}" as used in this text into Hebrew: "${ctx.slice(0,600)}". Return only JSON: {"base":"dictionary form of the word","he":"short Hebrew translation"}`);
  const f=allWords().find(x=>x.en.toLowerCase()===String(r.base||'').toLowerCase());render(r.base||word,r.he||'',f||null);}catch(e){m.hidden=true;aiErr(e);}}
