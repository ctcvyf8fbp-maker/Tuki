<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14a38a"/>
      <stop offset="1" stop-color="#0a5c50"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- soft glow -->
  <circle cx="120" cy="96" r="140" fill="#ffffff" opacity=".07"/>
  <!-- speech bubble -->
  <rect x="70" y="78" width="372" height="318" rx="120" fill="#fffdf9"/>
  <path d="M128 352 L92 452 L214 382 Z" fill="#fffdf9"/>
  <!-- crest feathers -->
  <ellipse cx="196" cy="146" rx="20" ry="46" transform="rotate(-28 196 146)" fill="#f97316"/>
  <ellipse cx="226" cy="132" rx="20" ry="50" transform="rotate(-10 226 132)" fill="#f2a93b"/>
  <ellipse cx="258" cy="134" rx="18" ry="44" transform="rotate(12 258 134)" fill="#ef4444"/>
  <!-- head -->
  <circle cx="240" cy="244" r="100" fill="url(#head)"/>
  <!-- cheek -->
  <ellipse cx="236" cy="282" rx="26" ry="16" fill="#ffb3b3" opacity=".95"/>
  <!-- eye -->
  <circle cx="284" cy="220" r="31" fill="#ffffff"/>
  <circle cx="291" cy="221" r="16" fill="#1d2433"/>
  <circle cx="297" cy="214" r="5.5" fill="#ffffff"/>
  <!-- beak -->
  <path d="M316 206 Q398 202 392 286 Q376 266 336 266 Q322 240 316 206 Z" fill="url(#beak)"/>
  <path d="M332 266 Q362 266 372 282 Q352 302 326 290 Z" fill="#c2410c"/>
  <!-- sound waves -->
  <path d="M402 196 Q416 220 402 244" fill="none" stroke="#0e7c6b" stroke-width="10" stroke-linecap="round"/>
  <path d="M422 176 Q446 220 422 264" fill="none" stroke="#0e7c6b" stroke-width="10" stroke-linecap="round" opacity=".55"/>
</svg>
